name: publish-beta

on:
  push:
    branches: 
        - master
        - main
    paths:
        - 'NewLife.BACnet/**'
  workflow_dispatch:

# GitHub Packages 需要 packages: write
permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    # net45 通过 Microsoft.NETFramework.ReferenceAssemblies 提供参考程序集，无需 Windows 专属依赖
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Build
      run: |
        dotnet pack --version-suffix $(date "+%Y.%m%d-beta%H%M") -c Release -o out NewLife.BACnet/NewLife.BACnet.csproj
    - name: Publish to GitHub Packages
      continue-on-error: true
      run: |
        dotnet nuget remove source github >/dev/null 2>&1 || true
        dotnet nuget add source https://nuget.pkg.github.com/NewLifeX/index.json \
          --name github --username ${{ github.repository_owner }} \
          --password ${{ github.token }} --store-password-in-clear-text
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source github
    - name: Publish to NuGet.org
      run: |
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
