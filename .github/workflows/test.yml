name: test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Restore
      run: dotnet restore NewLife.BACnet.slnx
    - name: Build
      run: dotnet build NewLife.BACnet.slnx -c Release --no-restore
    - name: Test
      run: dotnet test UnitTest/UnitTest.csproj -c Release --no-build --logger "console;verbosity=normal"
